name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npx --yes markdownlint-cli2 "README.md" "docs/*.md" ".github/*.md" || true
      - run: bash -n scripts/badge-quest.sh
